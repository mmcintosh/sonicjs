name = "my-sonicjs-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Account ID (required when you have multiple Cloudflare accounts)
# Using Infowall account
account_id = "f61c658f1de7911b0a529f38308adb21"

# Cloudflare Workers settings
workers_dev = true

# D1 Database
# Note: database_name and database_id are automatically updated by:
# - GitHub Actions (for PR preview deployments)
# - npm run setup:db (for local worktree development)
# Run `npm run setup:db` to create a fresh database for your branch
[[d1_databases]]
binding = "DB"
database_name = "sonicjs-worktree-fix-admin-content-form"
database_id = "f2c8a7cb-fb84-4c88-92cc-12bfe9548b74"
migrations_dir = "../packages/core/migrations"

# R2 Bucket for media storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "my-sonicjs-app-media"

# KV Cache
# Note: KV namespace IDs are environment-specific
# Local: Create with `npx wrangler kv:namespace create CACHE_KV`
# CI: Managed by GitHub Actions
[[kv_namespaces]]
binding = "CACHE_KV"
id = "placeholder"
preview_id = "placeholder"

# Environment variables
[vars]
ENVIRONMENT = "development"

# Production environment
[env.production]
name = "my-sonicjs-app-production"
vars = { ENVIRONMENT = "production" }

# Observability
[observability]
enabled = true
