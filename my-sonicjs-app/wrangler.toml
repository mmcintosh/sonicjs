name = "my-sonicjs-app"
main = "src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account
account_id = "f61c658f1de7911b0a529f38308adb21"  # Mmcintosh@infowall.com's Account

# Cloudflare Workers settings
workers_dev = true

# D1 Database
# Note: database_name and database_id are automatically updated by:
# - GitHub Actions (for PR preview deployments)
# - npm run setup:db (for local worktree development)
# Run `npm run setup:db` to create a fresh database for your branch
[[d1_databases]]
binding = "DB"
database_name = "sonicjs-worktree-feature-ai-search-plugin"
database_id = "6f8d5de1-4df4-44ac-99d4-8654e7c6b891"
migrations_dir = "./migrations"

# R2 Bucket for media storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "my-sonicjs-app-media"

# KV Cache
[[kv_namespaces]]
binding = "CACHE_KV"
id = "a16f8246fc294d809c90b0fb2df6d363"
preview_id = "25360861fb2745fab3b1ef2f0f13ffc8"

# Cloudflare AI (Workers AI)
# Enables built-in AI models for semantic search
# See: https://developers.cloudflare.com/workers-ai/
[ai]
binding = "AI"
remote = true

# Cloudflare Vectorize (for AI Search indexes)
# See: https://developers.cloudflare.com/vectorize/
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "sonicjs-search"
remote = true

# Environment variables
[vars]
ENVIRONMENT = "development"

# Production environment
[env.production]
name = "my-sonicjs-app-production"
vars = { ENVIRONMENT = "production" }

# Observability
[observability]
enabled = true
