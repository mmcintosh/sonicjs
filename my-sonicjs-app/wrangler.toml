name = "my-sonicjs-app"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers settings
workers_dev = true

# D1 Database
# Note: database_name and database_id are automatically updated by:
# - GitHub Actions (for PR preview deployments)
# - npm run setup:db (for local worktree development)
# Run `npm run setup:db` to create a fresh database for your branch
[[d1_databases]]
binding = "DB"
database_name = "sonicjs-worktree-fix-admin-content-form"
database_id = "f2c8a7cb-fb84-4c88-92cc-12bfe9548b74"
migrations_dir = "../packages/core/migrations"

# Note: R2 bucket and KV namespace bindings removed for CI compatibility
# The GitHub Actions workflow from main branch doesn't create these resources dynamically
# These can be added back when running locally or when the workflow is updated

# Environment variables
[vars]
ENVIRONMENT = "development"

# Production environment
[env.production]
name = "my-sonicjs-app-production"
vars = { ENVIRONMENT = "production" }

# Observability
[observability]
enabled = true
